<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Student Performance Dashboard</h1>
            <p>Interactive student performance monitoring system</p>
        </header>

        <section class="controls">

            <div class="control-group">
              <label for="searchInput"> Search Student </label>
              <input
                type="text"
                id="searchInput"
                placeholder="Enter Student Name"
            >
            </div>

            <div class="control-group">
                <label for="blockFilter">Block</label>

                <select id="blockFilter">
                    <option value="All">All</option>
                    <option value="31-ITE-01">31-ITE-01</option>
                    <option value="31-ITE-02">31-ITE-02</option>
                    <option value="31-ITE-03">31-ITE-03</option>
                </select>
            </div>

            <div class="control-group">
                <label for="statusFilter">Status</label>

                <select id="statusFilter">
                    <option value="All">All</option>
                    <option value="Excellent">Excellent</option>
                    <option value="Passed">Passed</option>
                    <option value="Needs Improvement">Needs Improvement</option>
                    <option value="Failed">Failed</option>
                </select>
            </div>

            <div class="buttons">
                <button id="applyBtn">Apply Filters</button>
                <button id="resetBtn">Reset</button>
            </div>

        </section>

        <section class="summary">

            <div class="summary-card">
                <h2>Class Average</h2>
                <span id="classAverage">0.00</span>
            </div>

            <div class="summary-card">
                <h2>Passing Count</h2>
                <span id="passingCount">0</span>
            </div>

            <div class="summary-card">
                <h2>Displayed Count</h2>
                <span id="displayedCount">0</span>
            </div>

            <div class="summary-card">
                <h2>Top Student</h2>
                <span id="topStudent">None</span>
            </div>
        </section>

        <div id="messageArea"></div>

        <section>
            <h2 class="section-title">Student Records</h2>
            <div id="studentList"></div>
        </section>
    </div>
    <script type="module" src="js/main.js"></script>

</body>
</html>
